<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Team Contribution</title>
</head>
<body>
  <h1>Team Contribution</h1>

  <button id="load-contributor">Show Contributor</button>
  <p id="contributor-student-id"></p>

  <a href="index.html">Back to Task Manager</a>

  <script>
    const button = document.getElementById('load-contributor');
    const output = document.getElementById('contributor-student-id');

    button.addEventListener('click', async function () {
      try {
        const res = await fetch('contribution.json');
        if (!res.ok) throw new Error('HTTP ' + res.status);
        const data = await res.json();
        output.textContent = 'Contributor Student ID: ' + data.contributorStudentId;
      } catch (err) {
        output.textContent = 'Could not load contributor: ' + err.message;
      }
    });
  </script>
</body>
</html>
